version: 2

models:
  - name: fact_sales
    description: One row per order item. Revenue definition for reports - exclude Cancelled; show Returned separately.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_customer'), field: customer_id}}
      - name: product_id
        data_tests:
          - relationships: {arguments: {to: ref('dim_product'), field: product_id}}
      - name: order_date
        data_tests:
          - relationships: {arguments: {to: ref('dim_date'), field: date_day}}
      - name: status
        data_tests:
          - accepted_values:
              arguments: {values: ['Placed', 'Shipped', 'Delivered', 'Cancelled', 'Returned']}

  - name: dim_customer
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: city
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['Bengaluru', 'Mumbai', 'Delhi', 'Hyderabad', 'Chennai', 'Pune', 'Kolkata', 'Ahmedabad', 'Jaipur', 'Surat']}

  - name: dim_product
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests:
          - not_null
          - accepted_values:
              arguments: {values: ['Electronics', 'Home & Kitchen', 'Fashion', 'Books', 'Beauty', 'Sports']}
      - name: supplier_cost
        data_tests: [not_null]

  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_web_sessions
    columns:
      - name: session_id
        data_tests: [unique, not_null]
